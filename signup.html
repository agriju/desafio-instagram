<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Faça Seu Cadastro</title>
</head>
<body>

<!-- INICIO AREA GERAL -->
    <div id="wrapper">

<!-- INICIO AREA CONTAINER -->
        <div id="container-signup">

<!-- INICIO AREA DIREITA -->
            <div class="column cadastro">
                <div class="login-panel">
                    <div class="logo">
                        <img class="logo-img" src="./ASSETS/logo.png" alt="logo do insta">
                    </div>

                    <div class="message">
                        <span> Cadastre-se para ver fotos e vídeos dos seus amigos.</span>
                    </div>

                    <button class="facebook-button">
                        Entrar com Facebook
                    </button>

                    <div class="divisor-container">
                        <div class="line"></div>
                        <div class="divisor-tag">ou</div>
                        <div class="line"></div>
                    </div>

                    <form action="">
                        <input placeholder="Número de celular ou email" type="text" name="email">
                        <input placeholder="Nome completo" type="text" name="name">
                        <input placeholder="Username" type="text" name="username">
                        <input placeholder="Senha" type="password" name="password">

                        <input type="submit" value="Entrar">
                    </form>
                </div>

                <div class="infobox">
                    <p>Tem uma conta? <a href="/index.html">Conecte-se</a> </p>
                </div>

                <div class="get-app-panel">
                    Obtenha o aplicativo
                    
                    <div class="app-butons">
                        
                        <a href="#">
                            <img src="./ASSETS/appstore.png" alt="app-store">
                        </a>
                        
                        <a href="#">
                            <img src="./ASSETS/googleplay.png" alt="google-play">
                        </a>
                    </div>
                </div>

            </div>
<!-- FIM AREA DIREITA -->

        </div>
<!-- FIM AREA CONTAINER -->

<!-- INICIO RODAPE -->
<footer>
    <div class="footer-inner">
        <a href="#">About Us</a>
        <a href="#">Support</a>
        <a href="#">Blog</a>
        <a href="#">Press</a>
        <a href="#">Api</a>
        <a href="#">Jobs</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Directory</a>
        <a href="#">Profiles</a>
        <a href="#">Hashtags</a>
        <a href="#">Language</a>
        <div class="text-small">@ 2022 Instagram</div>
    </div>
</footer>

    </div>
<!-- FIM AREA GERAL -->

</body>
</html>
